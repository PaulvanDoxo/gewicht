<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gewicht">
<title>Gewicht bijhouden</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#2563eb;--bd:#e5e7eb;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--tx:#eef0f3;--mu:#9aa3af;--ac:#60a5fa;--bd:#2b303a;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--tx:#eef0f3;--mu:#9aa3af;--ac:#60a5fa;--bd:#2b303a;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.del{background:var(--rd)}
.chart{overflow-x:auto}
svg{width:100%;height:auto;display:block}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item small{color:var(--mu);display:block}
.empty{color:var(--mu);text-align:center;padding:16px 0}
:root{--bg:#f4f1ff;--card:#fff;--tx:#1e1b3a;--mu:#6e6a8f;--ac:#7c3aed;--ac2:#ec4899;--bd:#e7e2fb;--rd:#e11d48;--sh:0 8px 24px rgba(124,58,237,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1d;--card:#1b1833;--tx:#f1eeff;--mu:#a29fc7;--ac:#a78bfa;--ac2:#f472b6;--bd:#2d2851;--rd:#fb7185;--sh:0 8px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0f0d1d;--card:#1b1833;--tx:#f1eeff;--mu:#a29fc7;--ac:#a78bfa;--ac2:#f472b6;--bd:#2d2851;--rd:#fb7185;--sh:0 8px 24px rgba(0,0,0,.45)}
body{background:radial-gradient(120% 50% at 50% 0%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.hero h1{font-size:30px;margin:0;letter-spacing:-.02em;color:#fff}
.hero p{margin:6px 0 0;opacity:.92}
.card{border:0;border-radius:20px;box-shadow:var(--sh);padding:16px}
h2{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:15px;text-transform:none;letter-spacing:0}
h2::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.stats>div{border-radius:14px;padding:12px 4px}
.stats b{font-size:24px;letter-spacing:-.02em}
.stats>div:nth-child(1){background:color-mix(in srgb,var(--ac) 14%,transparent)}
.stats>div:nth-child(1) b{color:var(--ac)}
.stats>div:nth-child(2){background:color-mix(in srgb,#14b8a6 16%,transparent)}
.stats>div:nth-child(2) b{color:#14b8a6}
.stats>div:nth-child(3){background:color-mix(in srgb,var(--ac2) 15%,transparent)}
.stats>div:nth-child(3) b{color:var(--ac2)}
input{border-radius:12px;border:2px solid var(--bd);background:var(--bg);padding:12px}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:12px;padding:12px 18px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .12s}
button:active{transform:scale(.96)}
button.sec{background:var(--bg);color:var(--tx);border:2px solid var(--bd);box-shadow:none}
button.del{background:var(--rd);box-shadow:none}
.item{padding:12px 6px;border-radius:12px;border-bottom:1px solid var(--bd)}
.item:active{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.item b{font-size:18px}
label.btn{display:inline-block;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.item span{background:color-mix(in srgb,var(--ac) 14%,transparent);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<main>
<div class="hero"><h1>Mijn gewicht</h1><p>Volg je voortgang en haal je doel 🎯</p></div>

<div class="card stats" id="stats"></div>

<div class="card">
<h2 id="formTitle">Nieuwe meting</h2>
<div class="row">
<input id="kg" type="text" inputmode="decimal" placeholder="Gewicht in kg">
<input id="date" type="date">
</div>
<div class="row" style="margin-top:8px">
<button id="saveBtn">Opslaan</button>
<button id="cancelBtn" class="sec" hidden>Annuleren</button>
<button id="delBtn" class="del" hidden>Verwijderen</button>
</div>
</div>

<div class="card">
<h2>Grafiek</h2>
<div class="chart" id="chart"></div>
</div>

<div class="card">
<h2>Doelgewicht</h2>
<div class="row">
<input id="goal" type="text" inputmode="decimal" placeholder="Doel in kg">
<button id="goalBtn">Instellen</button>
</div>
</div>

<div class="card">
<h2>Metingen</h2>
<div id="list"></div>
</div>

<div class="card">
<h2>Exporteren</h2>
<div class="row"><button id="exportBtn" class="sec">Exporteer als CSV</button></div>
<p id="exportMsg" style="color:var(--mu);font-size:14px;margin:8px 0 0"></p>
</div>

<div class="card">
<h2>Importeren</h2>
<div class="row" id="dropZone">
<label class="btn" for="importFile">Kies CSV-bestand</label>
<button id="pasteBtn" class="sec">Plak gegevens</button>
</div>
<input id="importFile" type="file" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
<div id="pasteBox" hidden style="margin-top:8px">
<textarea id="pasteText" rows="6" placeholder="datum;gewicht_kg&#10;2026-10-01;82,4&#10;2026-10-08;81,9" style="width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:10px"></textarea>
<div class="row" style="margin-top:8px"><button id="pasteGo">Verwerk</button></div>
</div>
<p id="importMsg" style="color:var(--mu);font-size:14px;margin:8px 0 0">Ondersteunt datum;gewicht met komma of punt, en datums als 2026-10-31 of 31-10-2026. Bestaande metingen op dezelfde datum worden bijgewerkt.</p>
</div>
</main>

<script>
var data={entries:[],goal:null};
try{var s=localStorage.getItem('gewicht-app');if(s)data=JSON.parse(s);}catch(e){}
var editId=null;
function save(){try{localStorage.setItem('gewicht-app',JSON.stringify(data));}catch(e){}}
function $(id){return document.getElementById(id);}
function fmt(n){return n.toFixed(1).replace('.',',');}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0&&n<500?n:null;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nice(d){return new Date(d+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});}
function sorted(){return data.entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});}

function render(){
  var e=sorted();
  // stats
  var st=$('stats');
  if(!e.length){st.innerHTML='<div><b>–</b><span>Huidig</span></div><div><b>–</b><span>Verschil</span></div><div><b>'+(data.goal?fmt(data.goal):'–')+'</b><span>Doel</span></div>';}
  else{
    var last=e[e.length-1].kg,first=e[0].kg,diff=last-first;
    var third=data.goal?(last-data.goal):null;
    st.innerHTML='<div><b>'+fmt(last)+'</b><span>Huidig (kg)</span></div>'+
      '<div><b>'+(diff>0?'+':'')+fmt(diff)+'</b><span>Sinds start</span></div>'+
      '<div><b>'+(third===null?'–':(third>0?'+':'')+fmt(third))+'</b><span>Tot doel</span></div>';
  }
  // list
  var l=$('list');
  if(!e.length)l.innerHTML='<div class="empty">Nog geen metingen</div>';
  else l.innerHTML=e.slice().reverse().map(function(x){
    return '<div class="item" data-id="'+x.id+'"><div><b>'+fmt(x.kg)+' kg</b><small>'+nice(x.date)+'</small></div><span style="color:var(--ac)">Wijzig</span></div>';
  }).join('');
  Array.prototype.forEach.call(l.querySelectorAll('.item'),function(el){
    el.onclick=function(){startEdit(el.getAttribute('data-id'));};
  });
  drawChart(e);
}

function drawChart(e){
  var c=$('chart');
  if(e.length<2){c.innerHTML='<div class="empty">Voeg minstens twee metingen toe voor een grafiek</div>';return;}
  var W=340,H=210,pl=40,pr=12,pt=12,pb=28;
  var vals=e.map(function(x){return x.kg;});
  if(data.goal)vals.push(data.goal);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var pad=Math.max((mx-mn)*0.15,0.5);mn-=pad;mx+=pad;
  var t0=new Date(e[0].date).getTime(),t1=new Date(e[e.length-1].date).getTime();
  var span=Math.max(t1-t0,1);
  function X(d){return pl+(new Date(d).getTime()-t0)/span*(W-pl-pr);}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb);}
  var g='';
  for(var i=0;i<=3;i++){
    var v=mn+(mx-mn)*i/3,y=Y(v);
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)"/>'+
       '<text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mu)">'+fmt(v)+'</text>';
  }
  var pts=e.map(function(x){return X(x.date).toFixed(1)+','+Y(x.kg).toFixed(1);}).join(' ');
  var dots=e.map(function(x){return '<circle cx="'+X(x.date).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="4.5" fill="var(--card)" stroke="var(--ac)" stroke-width="2.5"/>';}).join('');
  var goal='';
  if(data.goal){var gy=Y(data.goal);goal='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--rd)" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(gy-5)+'" text-anchor="end" font-size="11" fill="var(--rd)">Doel '+fmt(data.goal)+'</text>';}
  var short=function(d){return new Date(d+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'});};
  var xl='<text x="'+pl+'" y="'+(H-8)+'" font-size="11" fill="var(--mu)">'+short(e[0].date)+'</text>'+
         '<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--mu)">'+short(e[e.length-1].date)+'</text>';
  c.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gewicht over tijd">'+g+goal+
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".4"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs><polygon points="'+pts+' '+X(e[e.length-1].date).toFixed(1)+','+(H-pb)+' '+X(e[0].date).toFixed(1)+','+(H-pb)+'" fill="url(#ag)"/><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+dots+xl+'</svg>';
}

function resetForm(){
  editId=null;$('kg').value='';$('date').value=today();
  $('formTitle').textContent='Nieuwe meting';
  $('cancelBtn').hidden=true;$('delBtn').hidden=true;$('saveBtn').textContent='Opslaan';
}
function startEdit(id){
  var x=data.entries.filter(function(e){return String(e.id)===String(id);})[0];
  if(!x)return;
  editId=x.id;$('kg').value=String(x.kg).replace('.',',');$('date').value=x.date;
  $('formTitle').textContent='Meting aanpassen';
  $('cancelBtn').hidden=false;$('delBtn').hidden=false;$('saveBtn').textContent='Bewaar wijziging';
  window.scrollTo({top:0,behavior:'smooth'});
}
$('saveBtn').onclick=function(){
  var kg=num($('kg').value),d=$('date').value;
  if(kg===null||!d){alert('Vul een geldig gewicht en een datum in.');return;}
  if(editId!==null){
    data.entries.forEach(function(x){if(x.id===editId){x.kg=kg;x.date=d;}});
  }else{
    data.entries.push({id:Date.now(),kg:kg,date:d});
  }
  save();resetForm();render();
};
$('cancelBtn').onclick=resetForm;
$('delBtn').onclick=function(){
  if(editId===null)return;
  if(!confirm('Deze meting verwijderen?'))return;
  data.entries=data.entries.filter(function(x){return x.id!==editId;});
  save();resetForm();render();
};
$('goalBtn').onclick=function(){
  var v=$('goal').value.trim();
  if(v===''){data.goal=null;}
  else{var n=num(v);if(n===null){alert('Vul een geldig doelgewicht in.');return;}data.goal=n;}
  save();render();
};
function csv(){return 'datum;gewicht_kg\n'+sorted().map(function(x){return x.date+';'+String(x.kg).replace('.',',');}).join('\n')+'\n';}
$('exportBtn').onclick=async function(){
  var msg=$('exportMsg');msg.textContent='';
  if(!data.entries.length){msg.textContent='Er zijn nog geen metingen om te exporteren.';return;}
  var name='gewicht-'+today()+'.csv',text=csv();
  if(window.claude&&claude.use){
    try{
      var dl=await claude.use('downloads');
      if(dl){await dl.save({filename:name,data:text});msg.textContent='Export klaar.';return;}
    }catch(e){if(e&&e.code==='declined'){return;}}
  }
  var file=null;
  try{file=new File([text],name,{type:'text/csv'});}catch(e){}
  if(file&&navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:name});
      msg.textContent='Gedeeld. Kies "Bewaar in Bestanden" om het CSV-bestand op te slaan.';
      return;
    }catch(e){if(e&&e.name==='AbortError'){return;}}
  }
  try{
    var url=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},10000);
    msg.textContent='Download gestart: '+name;
    return;
  }catch(e){}
  try{await navigator.clipboard.writeText(text);msg.textContent='Downloaden kan hier niet. De gegevens zijn naar het klembord gekopieerd.';}
  catch(e){msg.textContent='Exporteren lukt hier niet.';}
};
function parseDate(s){
  s=s.trim().replace(/^"|"$/g,'');
  var m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  var y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{
    m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
    if(!m)return null;
    d=+m[1];mo=+m[2];y=+m[3];
  }
  var t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function importText(text){
  var msg=$('importMsg');
  text=String(text).replace(/^\uFEFF/,'');
  var lines=text.split(/\r?\n/),added=0,updated=0,skipped=0;
  lines.forEach(function(line){
    line=line.trim();
    if(!line)return;
    var parts;
    if(line.indexOf(';')>-1)parts=line.split(';');
    else if(line.indexOf('\t')>-1)parts=line.split('\t');
    else{
      parts=line.split(',');
      if(parts.length>2)parts=[parts[0],parts.slice(1).join(',')];
    }
    if(parts.length<2){skipped++;return;}
    var d=parseDate(parts[0]);
    var kg=num(parts[1].trim().replace(/^"|"$/g,'').replace(/\s*kg$/i,''));
    if(!d||kg===null){
      if(!/datum|date/i.test(parts[0]))skipped++;
      return;
    }
    var ex=data.entries.filter(function(x){return x.date===d;})[0];
    if(ex){ex.kg=kg;updated++;}
    else{data.entries.push({id:Date.now()+added+updated+Math.floor(Math.random()*1000),kg:kg,date:d});added++;}
  });
  if(!added&&!updated){msg.textContent='Geen geldige metingen gevonden.'+(skipped?' ('+skipped+' regels overgeslagen)':'');return false;}
  save();render();
  msg.textContent='Import klaar: '+added+' nieuw, '+updated+' bijgewerkt'+(skipped?', '+skipped+' overgeslagen':'')+'.';
  return true;
}
function importFile(f){
  var msg=$('importMsg');
  if(!f)return;
  msg.textContent='Bestand lezen: '+f.name+'…';
  var r=new FileReader();
  r.onload=function(){importText(r.result);};
  r.onerror=function(){msg.textContent='Het bestand kon niet worden gelezen. Probeer "Plak gegevens".';};
  r.readAsText(f);
}
$('importFile').onchange=function(){
  var f=this.files&&this.files[0];
  importFile(f);
  try{this.value='';}catch(e){}
};
(function(){
  var z=$('dropZone');
  ['dragover','dragenter'].forEach(function(ev){z.addEventListener(ev,function(e){e.preventDefault();});});
  z.addEventListener('drop',function(e){
    e.preventDefault();
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    importFile(f);
  });
})();
$('pasteBtn').onclick=function(){$('pasteBox').hidden=!$('pasteBox').hidden;};
$('pasteGo').onclick=function(){
  if(importText($('pasteText').value)){$('pasteText').value='';$('pasteBox').hidden=true;}
};
if(data.goal)$('goal').value=String(data.goal).replace('.',',');
resetForm();render();
</script>
</body>
</html>
